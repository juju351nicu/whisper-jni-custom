plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.jreleaser' version '1.26.0'
    // Lombok: compileOnly / annotationProcessor の配線と、javadoc 用の delombok を自動設定する
    id 'io.freefair.lombok' version '9.5.0'
}

group = 'jp.clip'
version = project.version
description = 'JNI bindings for whisper.cpp (v1.9.3). Derived from whisper-jni by GiviMAD via Jaffe2718.'

repositories {
    mavenLocal()
    mavenCentral()
}

lombok {
    // JDK 25 でビルドするには 1.18.40 以上が必要
    version = '1.18.48'
}

dependencies {
    api 'org.slf4j:slf4j-api:2.0.16'

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.slf4j:slf4j-simple:2.0.16'

    // Gradle 9 no longer injects the test framework implementation automatically,
    // so the JUnit Platform launcher has to be declared explicitly.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    // Try to keep this as low as possible.
    // In a perfect world, this would be Java 8.
    //
    // NOTE: this is deliberately kept at 17 even though the build itself now runs on
    // Java 25 (Gradle 9). Consumers of the published jar therefore only need Java 17+.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Compile against the Java 17 API even when building with a newer JDK (e.g. Java 25).
    options.release = 17
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.source = '17'
    // 日本語 Javadoc が化けないように出力側の文字コードも固定する
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
    // Lombok が生成するアクセサには @return / @param が付かないので "missing" だけ doclint から外す
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

// Apache-2.0 では、配布物に LICENSE と NOTICE を含める必要がある。
tasks.named('jar', Jar) {
    metaInf {
        from(rootProject.file('LICENSE'))
        from(rootProject.file('NOTICE'))
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging.showStandardStreams = true

    // JDK 22 introduced --enable-native-access and JDK 24+ prints a loud warning when
    // native code is loaded from an unnamed module. whisper-jni is JNI by nature, so
    // grant it explicitly. Guarded so that older JDKs do not choke on an unknown flag.
    def testJavaMajor = Integer.parseInt(JavaVersion.current().majorVersion)
    if (testJavaMajor >= 22) {
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
}

// 高速化の計測（Step 5）。使い方は src/test/java/jp/clip/whisper/Benchmark.java の Javadoc を参照。
//   .\gradlew.bat benchmark "-Pbench.audio=C:\audio\meeting.wav" "-Pbench.models=models\ggml-small.bin;models\ggml-large-v3-turbo-q5_0.bin" "-Pbench.threads=4,8,12" "-Pbench.vad=both"
tasks.register('benchmark', JavaExec) {
    group = 'whisper-jni'
    description = 'Measures transcription speed (RTF) for model x threads x VAD combinations'

    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'jp.clip.whisper.Benchmark'

    // -Pbench.<key>=<value> をそのまま key=value 引数として渡す
    args = project.properties.findAll { it.key.startsWith('bench.') }.collect { "${it.key.substring(6)}=${it.value}" }

    // 計測中は whisper.cpp のログ（モデル読み込みの INFO など）を黙らせる
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'warn'
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'stdout.encoding', 'UTF-8'

    def benchJavaMajor = Integer.parseInt(JavaVersion.current().majorVersion)
    if (benchJavaMajor >= 22) {
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                // Apparently you need to do this because it doesn't get autofilled (at least for description)
                name = project.name
                description = project.description
                url = 'https://github.com/juju351nicu/whisper-jni-custom'

                licenses {
                    license {
                        // 由来 (GiviMAD/whisper-jni, Jaffe2718/whisper-jni) が Apache-2.0 のため、
                        // 本プロジェクトも Apache-2.0 を維持する。LICENSE ファイルと一致させること。
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }

                developers {
                    developer {
                        id = 'juju351nicu'
                        name = 'juju351nicu'
                        url = 'https://github.com/juju351nicu'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/juju351nicu/whisper-jni-custom.git'
                    developerConnection = 'scm:git:ssh://github.com/juju351nicu/whisper-jni-custom.git'
                    url = 'https://github.com/juju351nicu/whisper-jni-custom'
                }
            }
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

jreleaser {
    signing {
        active = 'ALWAYS'
        armored = true
    }

    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')

                    // Double the retry delay as publishing takes a long time
                    // Alternatively you can set JRELEASER_MAVENCENTRAL_STAGE: UPLOAD and manually publish
                    retryDelay = 40
                }
            }
        }
    }
}

tasks.register('generateHeaders', JavaCompile) {
    group = 'whisper-jni'
    description = 'Regenerates the JNI headers in src/main/native/jni from the Java native declarations'

    // native 宣言があるのは JNI bridge 層だけなので、その package だけをコンパイルする。
    // （Lombok を使う jp.clip.whisper を含めると annotation processor の配線も必要になる）
    source = fileTree('src/main/java/jp/clip/whisperjni')
    classpath = sourceSets.main.compileClasspath
    options.annotationProcessorPath = configurations.annotationProcessor
    destinationDirectory.set(layout.buildDirectory.dir('generated/jni-headers'))
    options.headerOutputDirectory.set(file('src/main/native/jni'))
}

// Custom tasks for ease of use
tasks.register('deployLocal') {
    group = 'whisper-jni'
    description = 'Convenience method to publish to maven local'

    dependsOn 'clean', 'build', 'publish'
    finalizedBy 'publishToMavenLocal'

    doLast {
        logger.lifecycle("Published version ${project.version}")
    }
}

tasks.named('build') { mustRunAfter tasks.named('clean') }
tasks.named('publish') { mustRunAfter tasks.named('build') }

tasks.register('deployMaven') {
    group = 'whisper-jni'
    description = 'Convenience method to publish to maven central'

    dependsOn tasks.named('deployLocal')
    finalizedBy 'jreleaserDeploy'
}

// Always republish to ~/.m2 even if nothing changed
